<!-- ============================================================
  Google Scholar Citation / h-index 위젯
  (Google Scholar 앞 2칸 들여쓰기 + Updated 날짜 다음 줄 표시)
  ============================================================ -->

<div id="scholar-widget" class="scholar-widget">
  <div class="scholar-stats">
    <a id="scholar-label-link" class="scholar-label" href="#" target="_blank" rel="noopener">&nbsp;&nbsp;Google Scholar</a>
    <span class="scholar-sep">|</span>
    <span class="scholar-stat">
      <span class="scholar-stat-value" id="scholar-citations">–</span>
      <span class="scholar-stat-label">Citations</span>
    </span>
    <span class="scholar-stat">
      <span class="scholar-stat-value" id="scholar-hindex">–</span>
      <span class="scholar-stat-label">h-index</span>
    </span>
    <span class="scholar-stat">
      <span class="scholar-stat-value" id="scholar-i10index">–</span>
      <span class="scholar-stat-label">i10-index</span>
    </span>
  </div>
  <div class="scholar-updated" id="scholar-updated"></div>
</div>

<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  .scholar-widget {
    font-family: inherit;
  }
  .scholar-stats {
    display: flex;
    align-items: baseline;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 0.5rem;
    font-size: 0.95rem;
    white-space: nowrap;
    min-height: 32px;   /* 모바일에서 블록이 눌려도 최소 높이 확보 */
    padding: 6px 2px 0 2px;
    box-sizing: border-box;
  }
  .scholar-label {
    font-weight: 700;
    color: #1a1a1a;
    text-decoration: none;
  }
  .scholar-label:hover {
    text-decoration: underline;
  }
  .scholar-sep {
    color: #bbb;
  }
  .scholar-stat {
    white-space: nowrap;
  }
  .scholar-stat-value {
    font-weight: 700;
    color: #1a1a1a;
    margin-right: 0.2rem;
  }
  .scholar-stat-label {
    color: #666;
    font-size: 0.85em;
  }
  .scholar-updated {
    color: #999;
    font-size: 0.85em;
    padding: 2px 2px 4px 2px;
    box-sizing: border-box;
  }
</style>

<script>
  (function () {
    const DATA_URL =
      "https://raw.githubusercontent.com/shleeucb-commit/scholar-stats/main/citations.json";

    fetch(DATA_URL, { cache: "no-store" })
      .then((res) => res.json())
      .then((data) => {
        document.getElementById("scholar-citations").textContent =
          data.citations_all ?? "–";
        document.getElementById("scholar-hindex").textContent =
          data.h_index_all ?? "–";
        document.getElementById("scholar-i10index").textContent =
          data.i10_index_all ?? "–";

        if (data.profile_url) {
          document.getElementById("scholar-label-link").href = data.profile_url;
        }

        if (data.updated_at) {
          const d = new Date(data.updated_at);
          document.getElementById("scholar-updated").textContent =
            "  Updated " + d.toLocaleDateString("ko-KR");
        }
      })
      .catch((err) => {
        console.error("Scholar stats load failed:", err);
      });
  })();
</script>
