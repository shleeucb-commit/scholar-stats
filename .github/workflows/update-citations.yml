name: Update Google Scholar citations

on:
  schedule:
    # 매일 UTC 21:00 (한국시간 06:00)에 실행
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scrape_scholar.py

      - name: Commit updated citations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add citations.json
          git diff --quiet --cached || git commit -m "chore: update citation metrics [skip ci]"
          git push
